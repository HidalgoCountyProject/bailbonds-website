name: Deploy to S3 and invalidate CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app with prerendering
        run: npm run build:prod
        env:
          API_KEY_PROD: ${{ secrets.API_KEY_PROD }}
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/affordable-site/browser s3://${{ secrets.S3_BUCKET }} --delete

      - name: Fix MJS content types
        run: aws s3 cp s3://${{ secrets.S3_BUCKET }}/assets/ s3://${{ secrets.S3_BUCKET }}/assets/ --recursive --exclude "*" --include "*.mjs" --content-type "application/javascript" --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

  test_contact_form:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Test Contact Form API
        id: test_api
        run: |
          echo "Esperando 30 segundos para propagación..."
          sleep 30
          
          echo '{
            "fullName": "CI Test User",
            "arrestedPerson": "CI Test Subject",
            "dob": "1990-01-01",
            "phone": "+19568679269",
            "message": "Automated test from CI/CD pipeline"
          }' > payload.json
          
          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "${{ secrets.PROD_API_URL }}" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.API_KEY_PROD }}" \
            -H "Origin: https://hidalgo-bailbonds.com" \
            -d @payload.json)
          
          echo "Código de respuesta: $RESPONSE"
          echo "Respuesta completa:"
          cat response.txt
          
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Error: API devolvió código $RESPONSE - La prueba falló"
            exit 1
          else
            echo "Prueba exitosa: API devolvió código 200"
            if grep -q '"success": *true' response.txt; then
              echo "Respuesta válida verificada"
            else
              echo "Error: Respuesta no contiene success:true"
              exit 1
            fi
          fi