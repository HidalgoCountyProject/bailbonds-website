<div class="overlay" *ngIf="show">
  <div class="modal">
    <h2 class="title">{{ lang==='es' ? 'Antes de empezar' : 'Before you start' }}</h2>
    <p class="message">{{ message }}</p>

    <!-- Mini preview of the toolbar controls -->
    <div class="toolbar-preview">
      <button class="toolbar-btn prev-btn" aria-label="Prev">◀</button>
      <button class="toolbar-btn sign-btn" aria-label="Sign">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
        </svg>
        <span>{{ lang==='es' ? 'Firmar' : 'Sign' }}</span>
      </button>
      <button class="toolbar-btn next-btn" aria-label="Next">▶</button>
    </div>

    <button class="ok-btn" (click)="close()">OK</button>
  </div>
</div>
