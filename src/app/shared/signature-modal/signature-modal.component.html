<!-- Overlay -->
<div class="overlay" *ngIf="show">
  <!-- Modal -->
  <div class="modal">
    <button class="close-btn" (click)="close()">&#10005;</button>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab" [class.active]="activeTab==='draw'" (click)="switchTab('draw')">DRAW</button>
      <button class="tab" [class.active]="activeTab==='type'" (click)="switchTab('type')">TYPE</button>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- DRAW TAB -->
      <ng-container *ngIf="activeTab==='draw'">
        <p class="section-title">DRAW SIGNATURE</p>
        <div class="canvas-container">
          <canvas #canvas
                  (mousedown)="onPointerDown($event)"
                  (mousemove)="onPointerMove($event)"
                  (mouseup)="onPointerUp($event)"
                  (mouseleave)="onPointerUp($event)"
                  (touchstart)="onPointerDown($event)"
                  (touchmove)="onPointerMove($event)"
                  (touchend)="onPointerUp($event)"></canvas>
        </div>
        <p class="legal">I agree that this electronic signature is legally binding and can be used by Affordable Bail Bonds.</p>
        <div class="rotate-info">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="40" height="40" fill="currentColor">
            <path d="M336 0c48.6 0 88 39.4 88 88v16.8c0 13.5-6.4 26.1-17.2 34.3l-36.6 27.4c-11.8 8.8-18.6 22.8-18.6 37.5V352c0 35.3-28.7 64-64 64H160c-48.6 0-88-39.4-88-88V88C72 39.4 111.4 0 160 0h176zM152 200c0 13.3 10.7 24 24 24h96c13.3 0 24-10.7 24-24s-10.7-24-24-24H176c-13.3 0-24 10.7-24 24zm0 80c0 13.3 10.7 24 24 24h96c13.3 0 24-10.7 24-24s-10.7-24-24-24H176c-13.3 0-24 10.7-24 24z" />
          </svg>
          Rotate your phone for more space
        </div>
        <div class="actions">
          <button class="clear" (click)="clear()">CLEAR SIGNATURE</button>
          <button class="save" (click)="save()">SAVE</button>
        </div>
      </ng-container>

      <!-- TYPE TAB -->
      <ng-container *ngIf="activeTab==='type'">
        <p class="section-title">TYPE SIGNATURE</p>
        <div class="field">
          <label>CHOOSE FONT:</label>
          <select [(ngModel)]="fontFamily">
            <option *ngFor="let f of fonts" [ngStyle]="{'font-family': f}" [value]="f">{{f}}</option>
          </select>
        </div>
        <div class="field">
          <label>TYPE SIGNATURE</label>
          <input type="text" [(ngModel)]="typedName" [style.font-family]="fontFamily" placeholder="Your Name" />
        </div>
        <p class="legal">I agree that this electronic signature is legally binding and can be used by Affordable Bail Bonds.</p>
        <div class="actions">
          <button class="clear" (click)="clear()">CLEAR NAME</button>
          <button class="save" (click)="save()">SAVE</button>
        </div>
      </ng-container>
    </div>
  </div>
</div>
