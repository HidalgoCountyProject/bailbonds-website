<div class="gate-container">
  <div class="backdrop"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" type="button" aria-label="Close" (click)="close()">×</button>
    <h2>Choose your language</h2>
    <p>Seleccione su idioma para continuar.</p>
    <div class="actions">
      <button type="button" class="btn" (click)="choose('en')">English</button>
      <button type="button" class="btn" (click)="choose('es')">Español</button>
    </div>
  </div>
</div>
