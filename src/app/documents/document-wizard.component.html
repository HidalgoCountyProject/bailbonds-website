<div class="wizard-view">
  <!-- Minimal header toolbar for document filling -->
  <header class="document-toolbar">
    <button class="toolbar-btn close-btn" (click)="close()" aria-label="Close form">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    
    <h1 class="document-title">Indemnitor Application</h1>
    
    <button class="toolbar-btn download-btn" (click)="downloadPdf()" aria-label="Download PDF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7,10 12,15 17,10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </button>
  </header>

  <!-- PDF Viewer with optimized settings for mobile form filling -->
  <div class="pdf-overlay" [class.show]="isLoading"></div>
  <div class="pdf-container">
    <ngx-extended-pdf-viewer
      [src]="pdfSrc"
      [height]="'calc(100vh - 60px)'"
      [zoom]="'page-fit'"
      [pageViewMode]="'multiple'"
      [showToolbar]="false"
      [showSidebarButton]="false"
      [showFindButton]="false"
      [showPagingButtons]="true"
      [showZoomButtons]="true"
      [showPresentationModeButton]="false"
      [showOpenFileButton]="false"
      [showPrintButton]="false"
      [showDownloadButton]="false"
      [showSecondaryToolbarButton]="false"
      [showRotateButton]="false"
      [showHandToolButton]="false"
      [showSpreadButton]="false"
      [showPropertiesButton]="false"
      [textLayer]="true"
      [showBorders]="false"
      (pdfLoaded)="onPdfLoaded($event)"
      (zoomChange)="onZoomChange($event)">
    </ngx-extended-pdf-viewer>
  </div>

  <!-- Floating "Click to Sign" button -->
  <button class="sign-btn" (click)="openSignature()">
    Click to Sign
  </button>

  <!-- Signature modal instance -->
  <app-signature-modal #signatureModal (saved)="onSignatureSaved($event)"></app-signature-modal>
</div>
